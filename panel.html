<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#0d1014">

<title>XLine Araç Kartı</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --bg:#0d1014;
    --surface:#15191f;
    --surface-2:#1b2027;
    --surface-3:#222831;

    --line:rgba(255,255,255,.075);

    --text:#f7f8fa;
    --muted:#8f98a6;
    --muted-2:#69727e;

    --green:#55d98b;
    --green-bg:rgba(85,217,139,.10);

    --orange:#f5b94c;
    --orange-bg:rgba(245,185,76,.10);

    --red:#ff5d63;
    --red-bg:rgba(255,93,99,.10);

    --blue:#6ea8ff;
    --blue-bg:rgba(110,168,255,.10);

    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:16px;

    --shadow:
        0 18px 50px rgba(0,0,0,.18);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        "Manrope",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(255,255,255,.035),
            transparent 28%
        ),
        var(--bg);

    color:var(--text);

    padding-bottom:
        calc(92px + env(safe-area-inset-bottom));
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1180px;
    margin:auto;
    padding:0 18px 35px;
}


/* =========================
   HEADER
========================= */

.topbar{
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.brand-small{
    font-size:10px;
    font-weight:800;
    letter-spacing:3.4px;
    color:var(--muted-2);
}

.page-title{
    margin-top:4px;

    font-size:21px;
    font-weight:800;
    letter-spacing:-.6px;
}

.profile-button{
    width:44px;
    height:44px;

    border-radius:50%;
    border:1px solid var(--line);

    background:var(--surface);

    color:white;

    display:grid;
    place-items:center;

    font-size:15px;
    font-weight:800;
}


/* =========================
   GENERIC
========================= */

.section{
    margin-top:27px;
}

.section-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:15px;

    margin:0 2px 13px;
}

.section-title{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.35px;
}

.section-subtitle{
    margin-top:3px;

    font-size:11px;
    color:var(--muted);
}

.section-link{
    border:0;
    background:none;
    color:var(--muted);

    font-size:11px;
    font-weight:700;

    padding:5px;
}

.card{
    background:var(--surface);
    border:1px solid var(--line);

    border-radius:var(--radius-lg);

    box-shadow:var(--shadow);
}


/* =========================
   VEHICLE HERO
========================= */

.vehicle-hero{
    position:relative;
    overflow:hidden;

    min-height:250px;

    padding:25px;

    border-radius:var(--radius-xl);

    background:
        linear-gradient(
            145deg,
            #1c2128 0%,
            #12161b 62%,
            #181d23 100%
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 25px 70px rgba(0,0,0,.28);
}

.vehicle-hero:after{
    content:"";

    position:absolute;
    width:230px;
    height:230px;

    right:-75px;
    bottom:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 68%
        );

    pointer-events:none;
}

.vehicle-top{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.vehicle-label{
    font-size:10px;
    letter-spacing:2px;
    font-weight:800;
    color:var(--muted);
}

.plate{
    margin-top:8px;

    font-size:30px;
    line-height:1;

    font-weight:800;
    letter-spacing:-1.2px;
}

.vehicle-model{
    margin-top:10px;

    color:#c1c7d0;

    font-size:14px;
    font-weight:600;
}

.qr-status{
    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 11px;

    border-radius:999px;

    background:var(--green-bg);

    color:var(--green);

    font-size:10px;
    font-weight:800;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 0 4px rgba(85,217,139,.08);
}

.vehicle-bottom{
    position:absolute;

    left:25px;
    right:25px;
    bottom:24px;

    z-index:2;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:20px;
}

.km-label{
    font-size:10px;
    color:var(--muted);
    font-weight:700;
}

.km{
    margin-top:4px;

    font-size:23px;
    font-weight:800;
    letter-spacing:-.6px;
}

.serial{
    text-align:right;

    font-size:10px;
    line-height:1.7;

    color:var(--muted);
}

.serial strong{
    display:block;

    color:#dce0e5;

    font-size:11px;
}


/* =========================
   STATS
========================= */

.stats{
    margin-top:12px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat-card{
    min-height:110px;

    padding:16px 14px;

    background:var(--surface);

    border:1px solid var(--line);
    border-radius:18px;
}

.stat-icon{
    width:31px;
    height:31px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:var(--surface-3);

    color:#c8ced6;

    margin-bottom:15px;
}

.stat-value{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.4px;
}

.stat-label{
    margin-top:4px;

    color:var(--muted);

    font-size:9px;
    font-weight:700;
    line-height:1.4;
}


/* =========================
   REMINDERS
========================= */

.reminder-list{
    display:grid;
    gap:9px;
}

.reminder{
    padding:16px;

    display:flex;
    align-items:center;

    gap:13px;

    background:var(--surface);

    border:1px solid var(--line);
    border-radius:17px;
}

.reminder-icon{
    width:42px;
    height:42px;

    flex:0 0 42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:var(--surface-3);

    color:#d9dee5;
}

.reminder-content{
    min-width:0;
    flex:1;
}

.reminder-title{
    font-size:13px;
    font-weight:750;
}

.reminder-detail{
    margin-top:3px;

    color:var(--muted);

    font-size:10px;
}

.reminder-state{
    font-size:10px;
    font-weight:800;

    text-align:right;
}

.state-red{ color:var(--red); }
.state-orange{ color:var(--orange); }
.state-green{ color:var(--green); }


/* =========================
   QUICK ACTIONS
========================= */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.quick{
    min-height:92px;

    padding:13px 7px;

    border:1px solid var(--line);
    border-radius:17px;

    background:var(--surface);

    color:var(--text);

    text-align:center;
}

.quick-icon{
    width:36px;
    height:36px;

    margin:0 auto 10px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:var(--surface-3);

    font-size:16px;
}

.quick-title{
    font-size:9px;
    line-height:1.35;

    font-weight:750;
}


/* =========================
   QR EVENTS
========================= */

.event-list{
    overflow:hidden;
}

.event{
    display:flex;
    gap:13px;

    padding:16px;

    border-bottom:1px solid var(--line);
}

.event:last-child{
    border-bottom:0;
}

.event-icon{
    width:38px;
    height:38px;

    flex:0 0 38px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:var(--surface-3);
}

.event-main{
    min-width:0;
    flex:1;
}

.event-title{
    font-size:12px;
    font-weight:750;
}

.event-detail{
    margin-top:3px;

    color:var(--muted);

    font-size:10px;
}

.event-time{
    color:var(--muted-2);

    font-size:9px;

    white-space:nowrap;
}


/* =========================
   GUIDE
========================= */

.guide-scroll{
    display:flex;
    gap:10px;

    overflow-x:auto;

    padding:1px 1px 7px;

    scrollbar-width:none;
}

.guide-scroll::-webkit-scrollbar{
    display:none;
}

.guide{
    min-width:137px;
    min-height:120px;

    padding:16px;

    border:1px solid var(--line);
    border-radius:18px;

    background:var(--surface);

    color:white;

    text-align:left;
}

.guide-icon{
    font-size:20px;
}

.guide-title{
    margin-top:19px;

    font-size:12px;
    font-weight:800;
}

.guide-text{
    margin-top:4px;

    font-size:9px;
    line-height:1.45;

    color:var(--muted);
}


/* =========================
   EMERGENCY
========================= */

.emergency-card{
    margin-top:28px;

    padding:20px;

    border-radius:22px;

    border:1px solid rgba(255,93,99,.20);

    background:
        linear-gradient(
            135deg,
            rgba(255,93,99,.13),
            rgba(255,93,99,.045)
        );
}

.emergency-label{
    color:var(--red);

    font-size:10px;
    font-weight:800;

    letter-spacing:1.5px;
}

.emergency-title{
    margin-top:7px;

    font-size:20px;
    font-weight:800;

    letter-spacing:-.5px;
}

.emergency-text{
    margin-top:5px;

    max-width:500px;

    color:#b4bbc5;

    font-size:11px;
    line-height:1.6;
}

.emergency-button{
    width:100%;

    margin-top:16px;

    min-height:50px;

    border:0;
    border-radius:14px;

    background:var(--red);
    color:white;

    font-size:12px;
    font-weight:800;

    letter-spacing:.3px;
}


/* =========================
   EMPTY / LOADING
========================= */

.empty{
    padding:25px;

    text-align:center;

    color:var(--muted);

    font-size:11px;
}

.loading{
    min-height:300px;

    display:grid;
    place-items:center;

    color:var(--muted);

    font-size:12px;
}

.loader{
    width:28px;
    height:28px;

    margin:0 auto 13px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.1);
    border-top-color:white;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav-wrap{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:100;

    padding:
        8px 12px
        calc(8px + env(safe-area-inset-bottom));
}

.bottom-nav{
    max-width:600px;

    margin:auto;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    padding:7px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;

    background:rgba(20,24,29,.94);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.4);
}

.nav-button{
    min-height:51px;

    border:0;
    border-radius:15px;

    background:transparent;
    color:var(--muted);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:4px;
}

.nav-button.active{
    background:rgba(255,255,255,.06);
    color:white;
}

.nav-icon{
    font-size:16px;
    line-height:1;
}

.nav-label{
    font-size:8px;
    font-weight:750;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:95px;

    z-index:200;

    transform:
        translate(-50%,20px);

    max-width:calc(100% - 35px);

    padding:12px 16px;

    border-radius:14px;

    background:#f5f6f7;
    color:#111;

    font-size:11px;
    font-weight:700;

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   DESKTOP
========================= */

@media(min-width:800px){

    .app{
        padding-left:28px;
        padding-right:28px;
    }

    .dashboard-grid{
        display:grid;

        grid-template-columns:
            minmax(0,1.2fr)
            minmax(330px,.8fr);

        gap:18px;
        align-items:start;
    }

    .vehicle-hero{
        min-height:300px;
    }

    .stats{
        gap:12px;
    }

    .stat-card{
        min-height:125px;
    }

    .quick-grid{
        grid-template-columns:repeat(4,1fr);
    }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

    .app{
        padding-left:13px;
        padding-right:13px;
    }

    .plate{
        font-size:25px;
    }

    .vehicle-hero{
        padding:20px;
    }

    .vehicle-bottom{
        left:20px;
        right:20px;
        bottom:20px;
    }

    .stats{
        gap:7px;
    }

    .stat-card{
        padding:13px 10px;
    }

    .stat-value{
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <div class="brand-small">
                XLINE ARAÇ KARTI
            </div>

            <div
                class="page-title"
                id="pageTitle"
            >
                Araç Merkezim
            </div>
        </div>

        <button
            class="profile-button"
            id="profileButton"
            onclick="openSection('profile')"
        >
            XL
        </button>

    </header>


    <main id="mainContent">

        <div class="loading">

            <div>
                <div class="loader"></div>
                Araç bilgileriniz hazırlanıyor...
            </div>

        </div>

    </main>

</div>


<div class="bottom-nav-wrap">

    <nav class="bottom-nav">

        <button
            class="nav-button active"
            data-section="home"
            onclick="openSection('home')"
        >
            <span class="nav-icon">⌂</span>
            <span class="nav-label">Ana Sayfa</span>
        </button>


        <button
            class="nav-button"
            data-section="vehicle"
            onclick="openSection('vehicle')"
        >
            <span class="nav-icon">◇</span>
            <span class="nav-label">Aracım</span>
        </button>


        <button
            class="nav-button"
            data-section="maintenance"
            onclick="openSection('maintenance')"
        >
            <span class="nav-icon">⌁</span>
            <span class="nav-label">Bakım</span>
        </button>


        <button
            class="nav-button"
            data-section="emergency"
            onclick="openSection('emergency')"
        >
            <span class="nav-icon">＋</span>
            <span class="nav-label">Acil</span>
        </button>


        <button
            class="nav-button"
            data-section="profile"
            onclick="openSection('profile')"
        >
            <span class="nav-icon">○</span>
            <span class="nav-label">Profil</span>
        </button>

    </nav>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>

<script>

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let vehicles = [];

let currentVehicle = null;
let currentSticker = null;

let reminders = [];
let qrEvents = [];
let maintenanceItems = [];
let expenses = [];

let activeSection = "home";


/* =========================================================
   DOM
========================================================= */

const mainContent =
    document.getElementById("mainContent");

const pageTitle =
    document.getElementById("pageTitle");

const profileButton =
    document.getElementById("profileButton");

const toast =
    document.getElementById("toast");


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        const {
            data:{ session },
            error
        } =
            await supabaseClient.auth.getSession();


        if(
            error ||
            !session
        ){

            window.location.href =
                "./index.html";

            return;
        }


        currentUser =
            session.user;


        setProfileInitial();


        await loadVehicles();


        if(!currentVehicle){

            renderNoVehicle();

            return;
        }


        await Promise.all([

            loadReminders(),
            loadQrEvents(),
            loadMaintenanceItems(),
            loadExpenses()

        ]);


        renderHome();


    }catch(error){

        console.error(error);

        mainContent.innerHTML = `
            <div class="card empty">
                Panel yüklenirken bir sorun oluştu.
                <br><br>
                Sayfayı yenileyerek tekrar deneyin.
            </div>
        `;

    }

}


/* =========================================================
   PROFILE INITIAL
========================================================= */

function setProfileInitial(){

    const email =
        currentUser?.email || "";

    const first =
        email
        .trim()
        .charAt(0)
        .toUpperCase();

    profileButton.textContent =
        first || "XL";

}


/* =========================================================
   VEHICLES
========================================================= */

async function loadVehicles(){

    const {
        data:stickers,
        error:stickerError
    } =
        await supabaseClient
        .from("stickers")
        .select(`
            id,
            serial_number,
            status,
            type,
            activated_at
        `)
        .eq(
            "owner_id",
            currentUser.id
        )
        .eq(
            "type",
            "vehicle"
        )
        .order(
            "activated_at",
            { ascending:false }
        );


    if(stickerError){
        throw stickerError;
    }


    if(
        !stickers ||
        stickers.length === 0
    ){

        vehicles = [];
        currentVehicle = null;

        return;
    }


    const stickerIds =
        stickers.map(item => item.id);


    const {
        data:profiles,
        error:profileError
    } =
        await supabaseClient
        .from("vehicle_profiles")
        .select("*")
        .in(
            "sticker_id",
            stickerIds
        );


    if(profileError){
        throw profileError;
    }


    vehicles =
        stickers.map(sticker => {

            const profile =
                profiles?.find(
                    item =>
                        item.sticker_id ===
                        sticker.id
                );

            return {
                sticker,
                profile:profile || null
            };

        });


    const firstComplete =
        vehicles.find(
            item => item.profile
        );


    if(firstComplete){

        currentSticker =
            firstComplete.sticker;

        currentVehicle =
            firstComplete.profile;

    }

}


/* =========================================================
   REMINDERS
========================================================= */

async function loadReminders(){

    if(!currentVehicle) return;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("vehicle_reminders")
        .select("*")
        .eq(
            "vehicle_profile_id",
            currentVehicle.id
        )
        .eq(
            "status",
            "active"
        )
        .order(
            "due_date",
            { ascending:true }
        );


    if(error){

        console.error(
            "Hatırlatmalar:",
            error
        );

        reminders = [];

        return;
    }


    reminders =
        data || [];

}


/* =========================================================
   QR EVENTS
========================================================= */

async function loadQrEvents(){

    if(!currentVehicle) return;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("vehicle_qr_events")
        .select(`
            id,
            event_type,
            action_type,
            sender_name,
            sender_message,
            seen_at,
            resolved_at,
            created_at
        `)
        .eq(
            "vehicle_profile_id",
            currentVehicle.id
        )
        .order(
            "created_at",
            { ascending:false }
        )
        .limit(5);


    if(error){

        console.error(
            "QR olayları:",
            error
        );

        qrEvents = [];

        return;
    }


    qrEvents =
        data || [];

}


/* =========================================================
   MAINTENANCE
========================================================= */

async function loadMaintenanceItems(){

    if(!currentVehicle) return;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("vehicle_maintenance_items")
        .select("*")
        .eq(
            "vehicle_profile_id",
            currentVehicle.id
        )
        .eq(
            "active",
            true
        );


    if(error){

        console.error(
            "Bakım:",
            error
        );

        maintenanceItems = [];

        return;
    }


    maintenanceItems =
        data || [];

}


/* =========================================================
   EXPENSES
========================================================= */

async function loadExpenses(){

    if(!currentVehicle) return;


    const now =
        new Date();

    const startOfYear =
        new Date(
            now.getFullYear(),
            0,
            1
        );


    const {
        data,
        error
    } =
        await supabaseClient
        .from("vehicle_expenses")
        .select(`
            id,
            amount,
            category,
            expense_date
        `)
        .eq(
            "vehicle_profile_id",
            currentVehicle.id
        )
        .gte(
            "expense_date",
            formatDateForDatabase(
                startOfYear
            )
        );


    if(error){

        console.error(
            "Masraflar:",
            error
        );

        expenses = [];

        return;
    }


    expenses =
        data || [];

}

/* =========================================================
   REMINDER LOGIC
========================================================= */

function getReminderInfo(reminder){

    const now =
        new Date();

    let state =
        "Takipte";

    let detail =
        reminder.description ||
        "Hatırlatma";

    let className =
        "state-green";

    let icon =
        "◷";


    if(reminder.due_date){

        const due =
            new Date(
                reminder.due_date +
                "T12:00:00"
            );

        const diff =
            Math.ceil(
                (
                    due.getTime() -
                    now.getTime()
                ) /
                86400000
            );


        if(diff < 0){

            state =
                Math.abs(diff) +
                " gün geçti";

            className =
                "state-red";

        }else if(diff === 0){

            state =
                "Bugün";

            className =
                "state-red";

        }else{

            state =
                diff +
                " gün";

            className =
                diff <= 7
                ? "state-red"
                : diff <= 30
                ? "state-orange"
                : "state-green";

        }


        detail =
            formatTurkishDate(
                reminder.due_date
            );

    }


    if(
        reminder.due_km !== null &&
        reminder.due_km !== undefined &&
        currentVehicle.current_km !== null &&
        currentVehicle.current_km !== undefined
    ){

        const km =
            reminder.due_km -
            currentVehicle.current_km;


        if(!reminder.due_date){

            state =
                km <= 0
                ? "Zamanı geldi"
                : formatNumber(km) +
                  " km";

            className =
                km <= 0
                ? "state-red"
                : km <=
                  (
                    reminder.remind_km_before ||
                    1000
                  )
                ? "state-orange"
                : "state-green";

            detail =
                formatNumber(
                    reminder.due_km
                ) +
                " km hedef";

        }

    }


    const icons = {

        inspection:"◇",
        traffic_insurance:"▣",
        casco:"◆",
        maintenance:"⌁",
        tire:"◉",
        battery:"▤",
        tax:"₺",
        custom:"◷"

    };


    icon =
        icons[
            reminder.reminder_type
        ] || "◷";


    return {
        state,
        detail,
        className,
        icon
    };

}


/* =========================================================
   STATS LOGIC
========================================================= */

function getNearestMaintenanceKm(){

    if(
        currentVehicle.current_km === null ||
        currentVehicle.current_km === undefined
    ){
        return null;
    }


    const targets =
        maintenanceItems
        .filter(
            item =>
                item.next_service_km !== null &&
                item.next_service_km !== undefined
        )
        .map(
            item =>
                item.next_service_km -
                currentVehicle.current_km
        );


    if(targets.length === 0){
        return null;
    }


    return Math.max(
        0,
        Math.min(...targets)
    );

}


function getInspectionDays(){

    if(!currentVehicle.inspection_date){
        return null;
    }


    const now =
        new Date();

    const due =
        new Date(
            currentVehicle.inspection_date +
            "T12:00:00"
        );


    return Math.ceil(
        (
            due.getTime() -
            now.getTime()
        ) /
        86400000
    );

}


function getCurrentMonthExpense(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth();


    return expenses.reduce(
        (total,item) => {

            const date =
                new Date(
                    item.expense_date +
                    "T12:00:00"
                );


            if(
                date.getFullYear() === year &&
                date.getMonth() === month
            ){

                return total +
                    Number(
                        item.amount || 0
                    );

            }


            return total;

        },
        0
    );

}

/* =========================================================
   HELPERS
========================================================= */

function formatNumber(value){

    return Number(value)
        .toLocaleString("tr-TR");

}


function formatCurrencyShort(value){

    const number =
        Number(value || 0);


    if(number >= 1000000){

        return (
            "₺" +
            (
                number /
                1000000
            ).toFixed(1) +
            "M"
        );

    }


    if(number >= 10000){

        return (
            "₺" +
            Math.round(
                number / 1000
            ) +
            "B"
        );

    }


    return (
        "₺" +
        Math.round(number)
            .toLocaleString("tr-TR")
    );

}


function formatDayValue(days){

    if(days < 0){

        return (
            Math.abs(days) +
            " gün geçti"
        );

    }


    if(days === 0){
        return "Bugün";
    }


    return days + " gün";

}


function formatTurkishDate(value){

    if(!value) return "";


    return new Date(
        value + "T12:00:00"
    ).toLocaleDateString(
        "tr-TR",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


function formatRelativeDate(value){

    const date =
        new Date(value);

    const now =
        new Date();

    const diff =
        now.getTime() -
        date.getTime();

    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1){
        return "Şimdi";
    }


    if(minutes < 60){
        return minutes + " dk";
    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){
        return hours + " sa";
    }


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7){
        return days + " gün";
    }


    return date.toLocaleDateString(
        "tr-TR",
        {
            day:"numeric",
            month:"short"
        }
    );

}


function formatDateForDatabase(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


function comingSoon(name){

    showToast(
        name +
        " sıradaki adımda aktif olacak."
    );

}


function showToast(text){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeJs(value){

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}
