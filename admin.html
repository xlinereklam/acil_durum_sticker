<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AraçX | Yönetim Merkezi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f2;color:#171717}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#171717;color:#fff;padding:25px 16px}.logo{font-size:28px;font-weight:900;margin:0 10px 28px}.logo b{color:#e11d2e}.nav button{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:none;color:#bbb;text-align:left;font-weight:700;margin:4px 0}.nav button:hover,.nav .on{background:#292929;color:#fff}main{padding:28px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.muted{color:#777;font-size:13px}.card{background:#fff;border:1px solid #e8e8e4;border-radius:18px;box-shadow:0 8px 28px #0000000c}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:18px}.stat{padding:17px}.stat small{color:#777;font-weight:bold}.stat strong{display:block;font-size:26px;margin-top:7px}.tools{display:flex;gap:9px;flex-wrap:wrap;padding:14px;margin-bottom:12px}.tools input{flex:1;min-width:280px}input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff}textarea{width:100%;min-height:80px}.btn{padding:11px 15px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.dark{background:#171717;color:#fff}.red{background:#d71920;color:#fff}.soft{background:#eee}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:13px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{font-size:11px;color:#777}tbody tr{cursor:pointer}tbody tr:hover{background:#fafaf8}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:900}.active,.sold{background:#e5f5eb;color:#147142}.paused{background:#fff0d5;color:#855600}.revoked{background:#fde5e5;color:#a11}.stock,.generated{background:#eee;color:#555}.printed{background:#f1eafa;color:#69408b}.at_dealer{background:#e7eefc;color:#34588f}.panel{padding:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info,.vehicle{padding:14px;border-radius:13px;background:#fafaf8;margin-top:9px}.vehicle{border:1px solid #eee;background:#fff}.section{margin:24px 0 8px}.event{padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.msg{padding:12px;border-radius:11px;background:#fff3d6;color:#745000;margin:10px 0}.err{padding:12px;background:#fdeaea;color:#991b1b;border-radius:11px}.loading{text-align:center;padding:30px;color:#777}
@media(max-width:850px){.app{display:block}aside{padding:14px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}main{padding:15px}.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside><div class="logo">Araç<b>X</b></div><div class="nav">
<button class="on" onclick="view('home',this)">▦ Genel Bakış</button><button onclick="view('labels',this)">▣ Etiketler</button><button onclick="view('support',this)">◉ Müşteri / Destek</button><button onclick="alert('Bayi yönetimini sonraki modülde açacağız.')">⌂ Bayiler</button>
</div></aside><main>
<div class="top"><div><h1>AraçX Yönetim Merkezi</h1><div id="mail" class="muted">Yetki kontrol ediliyor…</div></div><button class="btn soft" onclick="logout()">Çıkış</button></div>
<div id="error"></div>
<section id="home"><div id="stats" class="stats"><div class="card loading">Yükleniyor…</div></div><div class="card panel"><h2>Son Etiketler</h2><div id="recent" class="table"></div></div></section>
<section id="labels" class="hidden"><div class="card tools"><input id="q" placeholder="Seri, plaka, müşteri, telefon, e-posta veya bayi"><select id="st"><option value="">Tüm durumlar</option><option value="active">Aktif</option><option value="paused">Pasif</option><option value="stock">Aktivasyon bekliyor</option><option value="revoked">İptal</option></select><select id="inv"><option value="">Tüm fiziksel durumlar</option><option value="generated">Üretildi</option><option value="printed">Basıldı</option><option value="in_stock">Stokta</option><option value="at_dealer">Bayide</option><option value="sold">Satıldı</option></select><button class="btn dark" onclick="loadLabels()">Ara</button></div><div class="card table" id="labelsTable"></div></section>
<section id="support" class="hidden"><div class="card tools"><input id="sq" placeholder="Seri, plaka, telefon, müşteri veya e-posta"><button class="btn red" onclick="findCustomer()">Müşteriyi Bul</button></div><div id="results"></div></section>
<section id="detail" class="card panel hidden"></section>
</main></div>
<script>
let customer=null;
const E=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const D=v=>v?new Date(v).toLocaleString('tr-TR'):'—';
const T=s=>({active:'AKTİF',paused:'PASİF',stock:'AKTİVASYON BEKLİYOR',revoked:'İPTAL',generated:'ÜRETİLDİ',printed:'BASILDI',in_stock:'STOKTA',at_dealer:'BAYİDE',sold:'SATILDI'}[s]||s||'—');
async function init(){let {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='./activate.html';return}mail.textContent=session.user.email;let {data:a}=await supabaseClient.from('aracx_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!a){document.querySelector('main').innerHTML='<div class="card panel"><h2>Yetkisiz erişim</h2></div>';return}loadSummary();loadRecent()}
async function loadSummary(){let {data,error}=await supabaseClient.rpc('admin_dashboard_summary');if(error)return fail(error.message);let a=[['Müşteri',data.customers],['Araç',data.vehicles],['Toplam QR',data.stickers_total],['Aktif',data.stickers_active],['Pasif',data.stickers_paused],['Aktivasyon Bekliyor',data.stickers_stock],['Basıldı',data.printed],['Bayide',data.at_dealer],['Satıldı',data.sold],['Bayi',data.dealers]];stats.innerHTML=a.map(x=>`<div class="card stat"><small>${E(x[0])}</small><strong>${Number(x[1]||0)}</strong></div>`).join('')}
async function getLabels(search='',status='',inventory='',limit=100){return await supabaseClient.rpc('admin_list_stickers',{p_search:search||null,p_status:status||null,p_inventory_status:inventory||null,p_limit:limit,p_offset:0})}
function table(rows){if(!rows.length)return '<div class="loading">Kayıt bulunamadı.</div>';return `<table><thead><tr><th>Seri</th><th>Durum</th><th>Fiziksel</th><th>Müşteri</th><th>Telefon</th><th>Araç</th><th>Plaka</th><th>Bayi</th><th>Aktivasyon</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.owner_id?`onclick="openCustomer('${r.owner_id}')"`:''}><td><b>${E(r.serial_number)}</b></td><td><span class="badge ${E(r.technical_status)}">${E(T(r.technical_status))}</span></td><td><span class="badge ${E(r.inventory_status)}">${E(T(r.inventory_status))}</span></td><td>${E(r.owner_name||'—')}</td><td>${E(r.owner_phone||'—')}</td><td>${E([r.brand,r.model].filter(Boolean).join(' ')||'—')}</td><td><b>${E(r.plate||'—')}</b></td><td>${E(r.dealer_name||'—')}</td><td>${E(D(r.activated_at))}</td></tr>`).join('')}</tbody></table>`}
async function loadRecent(){let {data,error}=await getLabels('','','',10);recent.innerHTML=error?`<div class="err">${E(error.message)}</div>`:table(data||[])}
async function loadLabels(){labelsTable.innerHTML='<div class="loading">Aranıyor…</div>';let {data,error}=await getLabels(q.value.trim(),st.value,inv.value,300);labelsTable.innerHTML=error?`<div class="err">${E(error.message)}</div>`:table(data||[])}
async function findCustomer(){let {data,error}=await getLabels(sq.value.trim(),'','',100);if(error){results.innerHTML=`<div class="err">${E(error.message)}</div>`;return}let m=new Map;(data||[]).filter(x=>x.owner_id).forEach(x=>m.set(x.owner_id,x));results.innerHTML=`<div class="card panel"><h3>Bulunan Müşteriler</h3>${[...m.values()].map(r=>`<div class="vehicle" style="cursor:pointer" onclick="openCustomer('${r.owner_id}')"><b>${E(r.owner_name||r.owner_email)}</b><div class="muted">${E(r.owner_phone||'')} · ${E(r.owner_email||'')} · ${E(r.serial_number)}</div></div>`).join('')||'<div class="muted">Müşteri bulunamadı.</div>'}</div>`}
async function openCustomer(id){customer=id;document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));detail.classList.remove('hidden');detail.innerHTML='<div class="loading">Müşteri dosyası açılıyor…</div>';let {data,error}=await supabaseClient.rpc('admin_customer_detail',{p_user_id:id});if(error){detail.innerHTML=`<div class="err">${E(error.message)}</div>`;return}let c=data.customer||{},ss=data.stickers||[],ev=data.recent_qr_events||[],no=data.support_notes||[];detail.innerHTML=`<button class="btn soft" onclick="view('support')">← Geri</button><h2>${E(c.full_name||'İsimsiz Müşteri')}</h2><div class="muted">${E(c.email||'')} · Kayıt: ${E(D(c.created_at))}</div>
<h3 class="section">Müşteri Bilgileri</h3><div class="grid"><div class="info"><b>Ad Soyad</b><br>${E(c.full_name||'—')}</div><div class="info"><b>Telefon</b><br>${E(c.phone||'—')}</div><div class="info"><b>Son Giriş</b><br>${E(D(c.last_sign_in_at))}</div><div class="info"><b>Kendi Düzeltme Hakkı</b><br>${c.profile_edit_used?'Kullanıldı':'Kullanılmadı'}</div></div>
<h3 class="section">Araçlar ve QR Etiketleri</h3>${ss.map(s=>`<div class="vehicle"><b>${E(s.serial_number)} · ${E(s.plate||'Plaka yok')}</b><div class="muted">${E([s.brand,s.model,s.model_year].filter(Boolean).join(' '))}</div><div style="margin-top:8px"><span class="badge ${E(s.status)}">${E(T(s.status))}</span> <span class="badge ${E(s.inventory_status)}">${E(T(s.inventory_status))}</span></div><div class="muted">KM: ${E(s.current_km??'—')} · Bayi: ${E(s.dealer_name||'—')} · WhatsApp: ${s.whatsapp_enabled?'Açık':'Kapalı'}</div></div>`).join('')||'<div class="msg">Bağlı kart yok.</div>'}
<h3 class="section">Yetkili Bilgi Düzenleme</h3><div class="msg">Müşterinin kendi düzeltme hakkını sıfırlamaz. Yönetici işlemi kayıt altına alınır.</div><div class="grid"><input id="en" value="${E(c.full_name||'')}" placeholder="Ad Soyad"><input id="ep" value="${E(c.phone||'')}" placeholder="Telefon"><select id="paid"><option value="false">Ücretsiz destek</option><option value="true">Ücretli değişiklik</option></select><input id="amount" type="number" min="0" step=".01" placeholder="Ücret (TL)"></div><br><textarea id="desc" placeholder="İşlem açıklaması"></textarea><br><br><button class="btn red" onclick="saveEdit()">Bilgileri Güncelle</button><div id="saveResult"></div>
<h3 class="section">Son QR Hareketleri</h3>${ev.map(e=>`<div class="event"><b>${E(e.serial_number)}</b> · ${E(e.event_type)} → ${E(e.action_type)} <span class="muted">· ${E(D(e.created_at))}</span></div>`).join('')||'<div class="muted">Hareket yok.</div>'}
<h3 class="section">Destek Notları</h3>${no.map(n=>`<div class="event">${E(n.note)} <span class="muted">· ${E(D(n.created_at))}</span></div>`).join('')||'<div class="muted">Not yok.</div>'}`}
async function saveEdit(){let isPaid=paid.value==='true',a=amount.value;saveResult.innerHTML='<div class="msg">Kaydediliyor…</div>';let {error}=await supabaseClient.rpc('admin_update_customer_profile',{p_user_id:customer,p_full_name:en.value.trim(),p_phone:ep.value.trim(),p_is_paid:isPaid,p_amount:isPaid&&a?Number(a):null,p_description:desc.value.trim()||null});if(error){saveResult.innerHTML=`<div class="err">${E(error.message)}</div>`;return}saveResult.innerHTML='<div class="msg" style="background:#e5f5eb;color:#147142">Güncellendi ve işlem kaydedildi.</div>';setTimeout(()=>openCustomer(customer),700)}
function view(n,b){detail.classList.add('hidden');['home','labels','support'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==n));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');if(n==='labels')loadLabels()}
function fail(x){error.innerHTML=`<div class="err">${E(x)}</div>`}async function logout(){await supabaseClient.auth.signOut();location.href='./activate.html'}
q.addEventListener('keydown',e=>{if(e.key==='Enter')loadLabels()});sq.addEventListener('keydown',e=>{if(e.key==='Enter')findCustomer()});init();
</script></body></html>
