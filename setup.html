<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f6f5f3">

<title>AraçX | Araç Kurulumu</title>

<style>
*{box-sizing:border-box}

:root{
    --red:#e3262e;
    --text:#171717;
    --muted:#747474;
    --line:#e7e4df;
    --green:#17864b;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(227,38,46,.10),transparent 30%),
        linear-gradient(180deg,#fbfaf8,#f6f5f3);
    color:var(--text);
    padding:20px;
}

.wrap{
    width:100%;
    max-width:480px;
    margin:20px auto;
}

.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.mark{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,var(--red),#ff5359);
    color:#fff;
    font-size:23px;
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--red);
}

.sub{
    font-size:10px;
    color:#888;
    font-weight:800;
    letter-spacing:1.5px;
}

.card{
    background:#fff;
    border:1px solid rgba(0,0,0,.06);
    border-radius:26px;
    padding:25px 21px;
    box-shadow:0 20px 60px rgba(30,25,20,.10);
}

.step{
    display:inline-block;
    background:#fff0f0;
    color:var(--red);
    font-size:11px;
    font-weight:900;
    padding:7px 10px;
    border-radius:20px;
    margin-bottom:12px;
}

h1{
    font-size:27px;
    letter-spacing:-.7px;
    margin:0 0 8px;
}

.intro{
    font-size:14px;
    color:var(--muted);
    line-height:1.55;
    margin-bottom:22px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:12px;
    color:#666;
    font-weight:800;
    margin:0 0 6px;
}

input,
select{
    width:100%;
    height:50px;
    border:1px solid var(--line);
    background:#fbfbfa;
    border-radius:13px;
    padding:0 13px;
    font-size:15px;
    color:var(--text);
    outline:none;
}

input:focus,
select:focus{
    border-color:rgba(227,38,46,.55);
    box-shadow:0 0 0 3px rgba(227,38,46,.07);
    background:#fff;
}

.plate{
    text-transform:uppercase;
    font-weight:900;
    letter-spacing:.5px;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:17px;
    margin-top:22px;
    background:linear-gradient(135deg,var(--red),#f13d44);
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
}

.msg{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.msg.error{
    display:block;
    background:#fff0f0;
    color:#b51e24;
}

.msg.success{
    display:block;
    background:#ecf8f1;
    color:var(--green);
}

.serial{
    margin-top:17px;
    text-align:center;
    color:#999;
    font-size:11px;
}

.footer{
    text-align:center;
    color:#aaa;
    font-size:10px;
    margin-top:18px;
}

@media(max-width:430px){
    body{padding:12px}
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
}
</style>
</head>

<body>

<div class="wrap">

    <div class="brand">
        <div class="mark">🚗</div>

        <div>
            <div class="logo">Araç<span>X</span></div>
            <div class="sub">ARAÇ ASİSTANI</div>
        </div>
    </div>

    <div class="card">

        <div class="step">SON ADIM</div>

        <h1>Aracınızı tanıyalım</h1>

        <div class="intro">
            AraçX kartınız aktif. Aracınızın temel bilgilerini girerek kurulumu tamamlayın.
        </div>

        <div class="grid">

            <div class="full">
                <label>Plaka *</label>
                <input
                    id="plate"
                    class="plate"
                    maxlength="15"
                    placeholder="34 ABC 123">
            </div>

            <div>
                <label>Marka *</label>
                <input
                    id="brand"
                    maxlength="50"
                    placeholder="Honda">
            </div>

            <div>
                <label>Model *</label>
                <input
                    id="model"
                    maxlength="50"
                    placeholder="Civic">
            </div>

            <div>
                <label>Model Yılı</label>
                <input
                    id="year"
                    type="number"
                    inputmode="numeric"
                    min="1950"
                    max="2100"
                    placeholder="2022">
            </div>

            <div>
                <label>Güncel KM *</label>
                <input
                    id="km"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    placeholder="85000">
            </div>

            <div>
                <label>Yakıt Türü</label>

                <select id="fuel">
                    <option value="">Seçiniz</option>
                    <option value="gasoline">Benzin</option>
                    <option value="diesel">Dizel</option>
                    <option value="lpg">LPG</option>
                    <option value="hybrid">Hibrit</option>
                    <option value="electric">Elektrik</option>
                    <option value="other">Diğer</option>
                </select>
            </div>

            <div>
                <label>Vites</label>

                <select id="transmission">
                    <option value="">Seçiniz</option>
                    <option value="manual">Manuel</option>
                    <option value="automatic">Otomatik</option>
                    <option value="semi_automatic">Yarı Otomatik</option>
                    <option value="other">Diğer</option>
                </select>
            </div>

            <div class="full">
                <label>Renk</label>

                <input
                    id="color"
                    maxlength="40"
                    placeholder="Beyaz">
            </div>

        </div>

        <button id="saveButton">
            ARACIMI KAYDET VE BAŞLA
        </button>

        <div id="message" class="msg"></div>

        <div id="serial" class="serial"></div>

    </div>

    <div class="footer">
        AraçX • XLine Reklam & Yazılım
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>

<script>

const plateInput = document.getElementById("plate");
const brandInput = document.getElementById("brand");
const modelInput = document.getElementById("model");
const yearInput = document.getElementById("year");
const kmInput = document.getElementById("km");
const fuelInput = document.getElementById("fuel");
const transmissionInput = document.getElementById("transmission");
const colorInput = document.getElementById("color");

const saveButton = document.getElementById("saveButton");
const messageBox = document.getElementById("message");
const serialBox = document.getElementById("serial");

let currentUser = null;
let currentSticker = null;
let vehicleProfile = null;


/* =========================
   MESAJ
========================= */

function showMessage(text,type){

    messageBox.textContent = text;
    messageBox.className = "msg " + type;

}


/* =========================
   SAYFAYI BAŞLAT
========================= */

async function start(){

    const {
        data:{session},
        error:sessionError
    } = await supabaseClient.auth.getSession();


    if(sessionError || !session){

        window.location.replace("./index.html");
        return;

    }


    currentUser = session.user;


    /* =========================
       AKTİF ARAÇ KARTINI BUL
    ========================= */

    const {
        data:stickers,
        error:stickerError
    } = await supabaseClient
        .from("stickers")
        .select("id,serial_number,status,type")
        .eq("owner_id",currentUser.id)
        .eq("type","vehicle")
        .eq("status","active")
        .limit(1);


    if(stickerError){

        console.error(stickerError);

        showMessage(
            "AraçX kartınız kontrol edilemedi.",
            "error"
        );

        return;

    }


    if(!stickers || stickers.length === 0){

        showMessage(
            "Hesabınıza bağlı aktif AraçX kartı bulunamadı.",
            "error"
        );

        return;

    }


    currentSticker = stickers[0];

    serialBox.textContent =
        "AraçX • " + currentSticker.serial_number;


    /* =========================
       ARAÇ PROFİLİNİ BUL
    ========================= */

    const {
        data:profiles,
        error:profileError
    } = await supabaseClient
        .from("vehicle_profiles")
        .select(
            "id,sticker_id,owner_id,plate,brand,model,model_year,fuel_type,transmission_type,current_km,color"
        )
        .eq("owner_id",currentUser.id)
        .eq("sticker_id",currentSticker.id)
        .limit(1);


    if(profileError){

        console.error(profileError);

        showMessage(
            "Araç profili yüklenemedi.",
            "error"
        );

        return;

    }


    if(!profiles || profiles.length === 0){

        showMessage(
            "Araç profili bulunamadı.",
            "error"
        );

        return;

    }


    vehicleProfile = profiles[0];


    /* =========================
       DAHA ÖNCE KURULMUŞSA
       PANELE GÖNDER
    ========================= */

    if(
        vehicleProfile.plate &&
        vehicleProfile.brand &&
        vehicleProfile.model &&
        vehicleProfile.current_km !== null
    ){

        window.location.replace("./panel.html");
        return;

    }


    /* =========================
       VAR OLAN DEĞERLERİ DOLDUR
    ========================= */

    plateInput.value =
        vehicleProfile.plate || "";

    brandInput.value =
        vehicleProfile.brand || "";

    modelInput.value =
        vehicleProfile.model || "";

    yearInput.value =
        vehicleProfile.model_year || "";

    kmInput.value =
        vehicleProfile.current_km ?? "";

    fuelInput.value =
        vehicleProfile.fuel_type || "";

    transmissionInput.value =
        vehicleProfile.transmission_type || "";

    colorInput.value =
        vehicleProfile.color || "";

}


/* =========================
   ARACI KAYDET
========================= */

async function saveVehicle(){

    if(!currentUser || !vehicleProfile){

        showMessage(
            "Araç bilgileri henüz hazır değil.",
            "error"
        );

        return;

    }


    const plate =
        plateInput.value
            .trim()
            .toUpperCase();


    const brand =
        brandInput.value.trim();


    const model =
        modelInput.value.trim();


    const kmText =
        kmInput.value.trim();


    const km =
        Number(kmText);


    const yearText =
        yearInput.value.trim();


    const year =
        yearText === ""
            ? null
            : Number(yearText);


    if(!plate){

        showMessage(
            "Plakanızı girin.",
            "error"
        );

        return;

    }


    if(!brand){

        showMessage(
            "Araç markasını girin.",
            "error"
        );

        return;

    }


    if(!model){

        showMessage(
            "Araç modelini girin.",
            "error"
        );

        return;

    }


    if(
        kmText === "" ||
        !Number.isInteger(km) ||
        km < 0
    ){

        showMessage(
            "Geçerli güncel kilometre bilgisini girin.",
            "error"
        );

        return;

    }


    if(
        year !== null &&
        (
            !Number.isInteger(year) ||
            year < 1950 ||
            year > new Date().getFullYear() + 1
        )
    ){

        showMessage(
            "Model yılını kontrol edin.",
            "error"
        );

        return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
        "ARAÇ KAYDEDİLİYOR...";


    const {
        error
    } = await supabaseClient
        .from("vehicle_profiles")
        .update({

            plate:plate,

            brand:brand,

            model:model,

            model_year:year,

            current_km:km,

            fuel_type:
                fuelInput.value || null,

            transmission_type:
                transmissionInput.value || null,

            color:
                colorInput.value.trim() || null,

            updated_at:
                new Date().toISOString()

        })
        .eq("id",vehicleProfile.id)
        .eq("owner_id",currentUser.id);


    if(error){

        console.error(error);

        showMessage(
            "Araç kaydedilemedi.",
            "error"
        );

        saveButton.disabled = false;

        saveButton.textContent =
            "ARACIMI KAYDET VE BAŞLA";

        return;

    }


    showMessage(
        "Aracınız kaydedildi. AraçX açılıyor...",
        "success"
    );


    setTimeout(function(){

        window.location.replace("./panel.html");

    },700);

}


/* =========================
   BUTON
========================= */

saveButton.addEventListener(
    "click",
    saveVehicle
);


/* =========================
   BAŞLAT
========================= */

start();

</script>

</body>
</html>
