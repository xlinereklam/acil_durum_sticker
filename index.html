<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta name="theme-color" content="#0b0b0b">

<title>XLine Akıllı Araç</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #292929 0%,
            #0b0b0b 48%
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.card {
    width: 100%;
    max-width: 430px;

    background: rgba(23,23,23,.97);

    border: 1px solid #303030;
    border-radius: 26px;

    padding: 32px 24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.brand {
    text-align: center;

    letter-spacing: 5px;
    font-size: 11px;

    color: #777;

    margin-bottom: 25px;
}

.icon {
    width: 76px;
    height: 76px;

    margin: auto;

    border-radius: 50%;

    background: #242424;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 35px;

    border: 1px solid #383838;
}

h1 {
    text-align: center;

    font-size: 27px;

    margin:
        18px 0
        8px;
}

.description {
    text-align: center;

    color: #999;

    font-size: 14px;
    line-height: 1.5;

    margin-bottom: 28px;
}

label {
    display: block;

    color: #999;

    font-size: 12px;

    margin:
        15px 0
        6px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #383838;

    background: #101010;

    color: white;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #777;
}

.login {
    width: 100%;

    margin-top: 22px;

    padding: 17px;

    border: none;

    border-radius: 15px;

    background: #e12626;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.login:disabled {
    opacity: .5;
}

.message {
    display: none;

    margin-top: 16px;

    padding: 13px;

    border-radius: 12px;

    text-align: center;

    font-size: 13px;

    line-height: 1.5;
}

.message.error {
    display: block;

    background: #321616;

    color: #ff9696;
}

.message.success {
    display: block;

    background: #10291b;

    color: #79e59c;
}

.security {
    margin-top: 22px;

    padding: 13px;

    background: #111;

    border-radius: 12px;

    color: #666;

    font-size: 11px;

    text-align: center;

    line-height: 1.5;
}

.footer {
    margin-top: 24px;

    text-align: center;

    color: #555;

    font-size: 11px;
}

</style>
</head>


<body>

<div class="card">

    <div class="brand">
        XLINE SMART VEHICLE
    </div>


    <div class="icon">
        🚗
    </div>


    <h1>
        Araç Panelim
    </h1>


    <div class="description">
        Akıllı araç etiketinizi yönetin,
        gelen uyarıları görüntüleyin ve
        telefon bildirimlerinizi açın.
    </div>


    <label>
        E-posta
    </label>

    <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="E-posta adresiniz"
    >


    <label>
        Şifre
    </label>

    <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Şifreniz"
    >


    <button
        id="loginButton"
        class="login"
        onclick="login()"
    >
        GİRİŞ YAP
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <div class="security">
        Araç sahibinin telefon numarası
        QR kodu okutan kişilerle paylaşılmaz.
    </div>


    <div class="footer">
        XLine Reklam & Yazılım
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./js/config.js"></script>


<script>

const message =
    document.getElementById(
        "message"
    );


async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        window.location.replace(
            "./panel.html"
        );
    }
}


async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        showMessage(
            "E-posta ve şifrenizi girin.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "GİRİŞ YAPILIYOR...";


    const { data, error } =
        await supabaseClient.auth
            .signInWithPassword({
                email: email,
                password: password
            });


    if (error) {

        console.error(error);

        showMessage(
            "E-posta veya şifre hatalı.",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "GİRİŞ YAP";

        return;
    }


    if (!data.session) {

        showMessage(
            "Oturum oluşturulamadı.",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "GİRİŞ YAP";

        return;
    }


    showMessage(
        "Giriş başarılı.",
        "success"
    );


    window.location.replace(
        "./panel.html"
    );
}


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;
}


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                login();
            }
        }
    );


checkSession();

</script>

</body>
</html>
