<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f6f5f3"><title>AraçX | Araç Asistanı</title><style>*{box-sizing:border-box}:root{--red:#e3262e;--text:#171717;--muted:#747474;--line:#e7e4df;--bg:#f6f5f3}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(227,38,46,.10),transparent 32%),linear-gradient(180deg,#fbfaf8,#f6f5f3);color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:440px;background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.06);border-radius:28px;padding:28px 24px 24px;box-shadow:0 24px 70px rgba(34,28,24,.12)}.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--red),#ff5359);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}.logoText{font-size:25px;font-weight:900;letter-spacing:-1px}.logoText span{color:var(--red)}.sub{font-size:10px;color:#8b8b8b;font-weight:700;letter-spacing:1.6px}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:#f0eeeb;border-radius:15px;margin-bottom:20px}.tab{border:0;background:transparent;color:#777;padding:12px 8px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer}.tab.active{background:#fff;color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.07)}.form{display:none}.form.active{display:block}label{display:block;color:#686868;font-size:12px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#fbfbfa;color:var(--text);font-size:16px;outline:none}input:focus{border-color:rgba(227,38,46,.55);box-shadow:0 0 0 3px rgba(227,38,46,.08);background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--red),#f13d44);color:#fff;font-size:15px;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55}.message{display:none;margin-top:15px;padding:13px;border-radius:12px;text-align:center;font-size:13px;line-height:1.5}.message.error{display:block;background:#fff0f0;color:#b51e24;border:1px solid #ffd4d6}.message.success{display:block;background:#ecf8f1;color:#147541;border:1px solid #ccebd9}.note{margin-top:18px;padding:13px;border-radius:13px;background:#f7f6f4;color:#777;font-size:11px;line-height:1.55;border:1px solid #eeece9;text-align:center}.footer{margin-top:20px;text-align:center;color:#aaa;font-size:10px}@media(max-width:420px){body{padding:12px}.card{padding:24px 18px}.row{grid-template-columns:1fr}}</style></head><body><div class="card"><div class="logo"><div class="mark">🚗</div><div><div class="logoText">Araç<span>X</span></div><div class="sub">ARAÇ ASİSTANI</div></div></div><div class="hero"><h1 id="heading">Tekrar hoş geldiniz</h1><p id="desc">Araç bilgilerinizi, bakım süreçlerinizi ve AraçX kartınızı tek yerden yönetin.</p></div><div class="tabs"><button id="loginTab" class="tab active" onclick="switchMode('login')">Giriş Yap</button><button id="registerTab" class="tab" onclick="switchMode('register')">Hesap Oluştur</button></div><div id="loginForm" class="form active"><label>E-posta</label><input id="loginEmail" type="email" autocomplete="email" placeholder="E-posta adresiniz"><label>Şifre</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Şifreniz"><button id="loginButton" class="primary" onclick="login()">GİRİŞ YAP</button></div><div id="registerForm" class="form"><label>Ad Soyad</label><input id="registerName" autocomplete="name" maxlength="80" placeholder="Adınız ve soyadınız"><label>Telefon</label><input id="registerPhone" type="tel" autocomplete="tel" maxlength="20" placeholder="05XX XXX XX XX"><label>E-posta</label><input id="registerEmail" type="email" autocomplete="email" placeholder="E-posta adresiniz"><div class="row"><div><label>Şifre</label><input id="registerPassword" type="password" autocomplete="new-password" placeholder="En az 6 karakter"></div><div><label>Şifre Tekrar</label><input id="registerPasswordAgain" type="password" autocomplete="new-password" placeholder="Şifrenizi tekrar girin"></div></div><button id="registerButton" class="primary" onclick="register()">HESABIMI OLUŞTUR</button></div><div id="message" class="message"></div><div class="note">AraçX hesabınız ve araç kartınız size özeldir. İletişim tercihleriniz daha sonra Profil bölümünden yönetilebilir.</div><div class="footer">AraçX • XLine Reklam & Yazılım</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/config.js"></script><script>
const message=document.getElementById('message');
function switchMode(mode){const l=mode==='login';loginTab.classList.toggle('active',l);registerTab.classList.toggle('active',!l);loginForm.classList.toggle('active',l);registerForm.classList.toggle('active',!l);heading.textContent=l?'Tekrar hoş geldiniz':'AraçX hesabınızı oluşturun';desc.textContent=l?'Araç bilgilerinizi, bakım süreçlerinizi ve AraçX kartınızı tek yerden yönetin.':'Hesabınızı oluşturduktan sonra AraçX kartınızı aktive edebilirsiniz.';clearMessage()}
async function checkSession(){const{data:{session}}=await supabaseClient.auth.getSession();if(session)location.replace('./panel.html')}
async function login(){const email=loginEmail.value.trim(),password=loginPassword.value;if(!email||!password)return showMessage('E-posta ve şifrenizi girin.','error');setButton(loginButton,true,'GİRİŞ YAPILIYOR...');const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error||!data.session){console.error(error);showMessage('E-posta veya şifre hatalı.','error');return setButton(loginButton,false,'GİRİŞ YAP')}location.replace('./panel.html')}
async function register(){const fullName=registerName.value.trim(),phone=normalizePhone(registerPhone.value),email=registerEmail.value.trim(),password=registerPassword.value,passwordAgain=registerPasswordAgain.value;if(fullName.length<3)return showMessage('Ad ve soyadınızı girin.','error');if(!/^0?5\d{9}$/.test(phone))return showMessage('Geçerli bir telefon numarası girin.','error');if(!email||!email.includes('@'))return showMessage('Geçerli bir e-posta adresi girin.','error');if(password.length<6)return showMessage('Şifreniz en az 6 karakter olmalıdır.','error');if(password!==passwordAgain)return showMessage('Şifreler birbiriyle eşleşmiyor.','error');setButton(registerButton,true,'HESAP OLUŞTURULUYOR...');const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:fullName,phone}}});if(error){console.error(error);showMessage(registerError(error),'error');return setButton(registerButton,false,'HESABIMI OLUŞTUR')}if(data.session){showMessage('Hesabınız oluşturuldu. Kart aktivasyonuna geçiliyor.','success');setTimeout(()=>location.replace('./activate.html'),600);return}showMessage('Hesabınız oluşturuldu. E-posta doğrulaması açıksa gelen bağlantıyı onaylayın, ardından giriş yapın.','success');setButton(registerButton,false,'HESABIMI OLUŞTUR');setTimeout(()=>{switchMode('login');loginEmail.value=email;showMessage('E-posta doğrulamasından sonra giriş yapın.','success')},1200)}
function normalizePhone(v){return String(v||'').replace(/\D/g,'')}
function registerError(e){const t=String(e?.message||'').toLowerCase();if(t.includes('already')||t.includes('registered'))return 'Bu e-posta adresiyle daha önce hesap oluşturulmuş.';if(t.includes('password'))return 'Şifre güvenlik koşullarını karşılamıyor.';if(t.includes('email'))return 'E-posta adresini kontrol edin.';return 'Hesap oluşturulamadı. Bilgilerinizi kontrol edip tekrar deneyin.'}
function setButton(b,d,t){b.disabled=d;b.textContent=t}function showMessage(t,k){message.textContent=t;message.className='message '+k}function clearMessage(){message.textContent='';message.className='message'}loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')login()});registerPasswordAgain.addEventListener('keydown',e=>{if(e.key==='Enter')register()});checkSession();
</script></body></html>
