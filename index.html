<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#111111">

    <title>XLine Akıllı Etiket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0d;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: #171717;

            border: 1px solid #2b2b2b;
            border-radius: 24px;

            padding: 32px 24px;

            text-align: center;
        }

        .brand {
            font-size: 13px;
            letter-spacing: 4px;
            color: #999;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .description {
            color: #bdbdbd;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            padding: 16px;
            border-radius: 14px;

            background: #202020;

            font-size: 14px;
        }

        .status.testing {
            color: #dddddd;
        }

        .status.success {
            background: #10291b;
            color: #71e69a;
        }

        .status.error {
            background: #321616;
            color: #ff8b8b;
        }

        .footer {
            margin-top: 28px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="brand">
        XLINE
    </div>

    <h1>
        Akıllı Etiket Sistemi
    </h1>

    <div class="description">
        Araç Güvenlik Etiketi ve
        Moto Yaşam Kartı
    </div>

    <div
        id="connectionStatus"
        class="status testing"
    >
        Sistem bağlantısı kontrol ediliyor...
    </div>

    <div class="footer">
        XLine Reklam & Yazılım
    </div>

</div>


<!-- SUPABASE JAVASCRIPT KÜTÜPHANESİ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- BİZİM SUPABASE AYARLARIMIZ -->

<script src="./js/config.js"></script>


<script>

async function testConnection() {

    const status =
        document.getElementById("connectionStatus");

    try {

        /*
        Stickers tablosunun içeriğini istemiyoruz.
        Sadece Supabase ile iletişim kurulabiliyor mu
        kontrol ediyoruz.

        RLS nedeniyle anonim kullanıcı kayıtları
        okuyamamalı. Bu beklediğimiz davranış.
        */

        const { error } =
            await supabaseClient
                .from("stickers")
                .select("id")
                .limit(1);


        if (error) {

            /*
            RLS / permission hatası bağlantının
            çalışmadığı anlamına gelmez.

            Supabase bize cevap verdiyse bağlantı var.
            */

            console.log(
                "Supabase response:",
                error
            );
        }


        status.textContent =
            "✓ Sistem bağlantısı hazır";

        status.className =
            "status success";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Bağlantı kurulamadı";

        status.className =
            "status error";
    }
}


testConnection();

</script>

</body>
</html>
